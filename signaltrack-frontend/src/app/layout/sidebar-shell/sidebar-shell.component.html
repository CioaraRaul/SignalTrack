<aside class="sidebar-shell" [class.collapsed]="!ui.sidebarOpen()">
  <div class="sidebar-header">
    <h2 class="title">SignalTrack</h2>
    <nav class="nav-links">
      <a routerLink="/map" routerLinkActive="active" class="nav-link">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor">
          <path
            fill-rule="evenodd"
            d="M12 1.586l-4 4v12.828l4-4V1.586zM3.707 3.293A1 1 0 002 4v10a1 1 0 00.293.707L6 18.414V5.586L3.707 3.293zM14 5.586v12.828l2.293-2.293A1 1 0 0017 16V6a1 1 0 00-.293-.707L14 2.586v3z"
            clip-rule="evenodd"
          />
        </svg>
        Hartă
      </a>
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor">
          <path
            d="M2 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5zM8 7a1 1 0 011-1h2a1 1 0 011 1v9a1 1 0 01-1 1H9a1 1 0 01-1-1V7zM14 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1h-2a1 1 0 01-1-1V4z"
          />
        </svg>
        Dashboard
      </a>
    </nav>
  </div>

  @if (ui.sidebarOpen()) {
    <div class="filter-tabs">
      @for (f of filters; track f.value) {
        <button
          class="filter-tab"
          [class.active]="ui.activeFilter() === f.value"
          (click)="setFilter(f.value)"
        >
          {{ f.label }}
          <span class="badge">{{ getCount(f.value) }}</span>
        </button>
      }
    </div>

    <div class="vehicle-list-container">
      <app-vehicle-list />
    </div>
  }
</aside>
