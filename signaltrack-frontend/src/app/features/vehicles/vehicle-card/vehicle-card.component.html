<article class="vehicle-card" [class.selected]="isSelected()" (click)="onClick()">
  <div class="card-header">
    <span class="plate">{{ vehicle().plateNumber }}</span>
    <div class="header-actions">
      <app-status-badge [status]="vehicle().status" />
      <button class="edit-btn" (click)="onEditClick($event)" title="Editează vehiculul">
        <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor">
          <path
            d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"
          />
        </svg>
      </button>
      <button
        class="delete-btn"
        (click)="onDeleteClick($event)"
        [disabled]="deleting()"
        title="Șterge vehiculul"
      >
        <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor">
          <path
            fill-rule="evenodd"
            d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z"
            clip-rule="evenodd"
          />
        </svg>
      </button>
    </div>
  </div>

  @if (confirmingDelete()) {
    <div class="confirm-bar">
      <span class="confirm-text">Ștergi vehiculul?</span>
      <div class="confirm-actions">
        <button class="confirm-yes" (click)="onConfirmDelete($event)" [disabled]="deleting()">
          {{ deleting() ? '...' : 'Da' }}
        </button>
        <button class="confirm-no" (click)="onCancelDelete($event)">Nu</button>
      </div>
    </div>
  }

  <div class="driver">{{ vehicle().driverName }}</div>

  <div class="card-details">
    <div class="detail-row">
      <span class="detail-label">Viteză</span>
      <span class="detail-value">{{ vehicle().speed | speedFormat }}</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Combustibil</span>
      <app-fuel-bar [level]="vehicle().fuelLevel" />
    </div>
    <div class="detail-row">
      <span class="detail-label">Actualizat</span>
      <span class="detail-value muted">{{ vehicle().lastUpdate | timeAgo }}</span>
    </div>
  </div>
</article>

@if (editing()) {
  <app-edit-vehicle-dialog
    [vehicle]="vehicle()"
    (saved)="onEditSaved($event)"
    (cancelled)="onEditCancelled()"
  />
}
