<div class="map-wrapper" [class.add-vehicle-mode]="ui.addVehicleMode()">
  <div class="map-container" #mapContainer></div>

  @if (ui.addVehicleMode() && !showDialog()) {
    <div class="map-hint">Click pe hartă pentru a plasa vehiculul</div>
  }

  <button
    class="fab"
    [class.cancel]="ui.addVehicleMode()"
    (click)="toggleAddVehicleMode()"
    [title]="ui.addVehicleMode() ? 'Anulează' : 'Adaugă vehicul'"
  >
    @if (ui.addVehicleMode()) {
      <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
        <path
          d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
        />
      </svg>
    } @else {
      <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
        <path
          d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z"
        />
      </svg>
    }
  </button>

  @if (showDialog()) {
    <app-add-vehicle-dialog
      [coords]="dialogCoords()"
      (saved)="onVehicleSaved($event)"
      (cancelled)="onDialogCancelled()"
    />
  }
</div>
